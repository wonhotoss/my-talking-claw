[project]
name = "my-talking-claw-audio"
version = "0.1.0"
description = "The device's resident audio loop: owns the microphone and the speaker, viewers only draw."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<2",
    "sounddevice>=0.5.0",
    "openwakeword>=0.6.0",
    "onnxruntime>=1.17",
    "httpx>=0.28.0",
    # app/transcriber.py azure_transcriber. Plain wheel on the RPi's aarch64
    # (verified 2026-11-08); imported lazily, STT_ENGINE=whisper never loads it.
    "azure-cognitiveservices-speech>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
