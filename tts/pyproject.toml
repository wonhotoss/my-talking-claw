[project]
name = "my-talking-claw-tts"
version = "0.1.0"
description = "Standalone on-device Korean TTS service (MeloTTS)."
requires-python = ">=3.11"
# The MeloTTS engine (torch, mecab-ko, unidic) is installed separately on the
# deployment host — see the Dockerfile. It is not a locked dependency here so
# the service code and unit tests remain installable/runnable on any platform
# (including Windows, where mecab-ko has no wheel).
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Only the RMS envelope in app/viseme.py needs this. Kept <2 to match the
    # torch 2.2.2 pin in Dockerfile.melo, where numpy already comes via torch.
    "numpy>=1.26,<2",
    # app/speech.py writes the WAV with it. Unlike the engines this is not
    # platform-hostile - the wheel bundles libsndfile everywhere, including
    # Windows - so it stays a locked dependency and the timeline tests can run
    # end to end on the dev box.
    "soundfile>=0.12",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
