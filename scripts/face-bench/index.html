<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>face idle bench</title>
<!--
  The same idle behaviour drawn six ways, to measure what each costs on the
  RPi4 (800x480 DSI, Chromium 142 on labwc). ?mode= one of:

    static      inline SVG, nothing moves                  - the floor
    svg_attr    JS rewrites SVG attributes every frame      - "draw everything in SVG"
                (breathe+sway on a root <g>, gaze, blink ry)
    svg_hybrid  CSS breathe+sway on the <svg> element, JS   - what the face does on
                writes gaze/ry attributes only when they     claude/kiosk-face-idle
                change
    layers_css  parts split into HTML layers (inline SVG),  - pure compositing:
                all motion as CSS transforms on the layers    nothing is re-rasterised
    layers_img  same layers as PNG images rasterised once   - "image-based"
    canvas      one 2D canvas redrawn every frame

  All modes share one seeded schedule (blink 130 ms every 2.2-5.8 s, a glance
  every 1.8-6 s with a 50 ms saccade, breathe 4.2 s, sway 13 s), so they show
  the same motion and differ only in how it reaches the screen. JS work is
  throttled to 30 fps like face_view.tsx; CSS animations run at the display rate.
-->
<style>
  html, body { margin: 0; height: 100%; background: #0d1b22; overflow: hidden; }
  #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  #face { position: relative; width: 480px; height: 480px; }
  svg.full { display: block; width: 480px; height: 480px; }
  .ink { fill: #7fd6c4; stroke: #7fd6c4; }
  .cheek { fill: #7fd6c4; opacity: 0.16; }
  .brow { fill: none; stroke-width: 9; stroke-linecap: round; }
  .mouth { stroke-width: 10; stroke-linejoin: round; stroke-linecap: round; }
  .layer { position: absolute; left: 0; top: 0; width: 480px; height: 480px; will-change: transform; }
  .eye { position: absolute; will-change: transform; }

  @keyframes breathe { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.006); } }
  @keyframes sway {
    0%, 100% { rotate: 0deg; translate: 0 0; }
    30% { rotate: -1.6deg; translate: -5px 0; }
    70% { rotate: 1.4deg; translate: 4px 0; }
  }
  .moving { transform-origin: 50% 72%; animation: breathe 4.2s ease-in-out infinite, sway 13s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.09); } }
  .blinking { animation: blink 130ms linear; }
  .saccade { transition: transform 120ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .drifting { transform-origin: 50% 72%; transition: transform 1.6s ease-in-out; will-change: transform; }
  #breath { will-change: transform; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";

const mode = new URLSearchParams(location.search).get("mode") || "static";
const stage = document.getElementById("stage");
// viewBox 400 -> 480 px.
const px = 480 / 400;
const eye_ry_open = 27;
const eye_ry_closed = 2.5;
const blink_ms = 130;
const frame_ms = 33;
const mouth_d = "M 164.0 266.4 C 177.7 265.8 222.3 265.8 236.0 266.4 C 222.3 271.1 177.7 271.1 164.0 266.4 Z";

// mulberry32: one seed, so every mode sees the same blinks and glances.
let seed = 20261110;
function rand() {
  seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}

const bench = { raf: 0, frames: 0, writes: 0, blinks: 0, glances: 0 };
window.__bench = bench;

// --- the shared schedule ------------------------------------------------------
const state = { next_blink: 2500, blink_start: -1, next_glance: 2000, gx: 0, gy: 0, tx: 0, ty: 0 };

function tick_schedule(now, delta) {
  let blink_started = false;
  let glance_started = false;

  if (state.blink_start < 0 && now >= state.next_blink) {
    state.blink_start = now;
    blink_started = true;
    bench.blinks++;
  }

  let open = 1;

  if (state.blink_start >= 0) {
    const elapsed = now - state.blink_start;

    if (elapsed >= blink_ms) {
      state.blink_start = -1;
      state.next_blink = now + 2200 + rand() * 3600;
    } else {
      open = 1 - Math.sin(Math.PI * elapsed / blink_ms);
    }
  }

  if (now >= state.next_glance) {
    if (rand() < 0.35) { state.tx = 0; state.ty = 0; }
    else { state.tx = (rand() * 2 - 1) * 11; state.ty = (rand() * 2 - 1) * 6; }
    state.next_glance = now + 1800 + rand() * 4200;
    glance_started = true;
    bench.glances++;
  }

  const k = Math.exp(-delta / 0.05);
  state.gx = state.tx + (state.gx - state.tx) * k;
  state.gy = state.ty + (state.gy - state.ty) * k;

  return { open, blink_started, glance_started };
}

// Breathe and sway as functions of time, for the modes that draw them in JS.
function body_pose(now) {
  const b = (1 - Math.cos(2 * Math.PI * now / 4200)) / 2;
  const s = Math.sin(2 * Math.PI * now / 13000);
  return { dy: -6 * b, scale: 1 + 0.006 * b, rot: -1.5 * s, dx: -4.5 * s };
}

// --- markup -------------------------------------------------------------------
const base_svg = `
  <circle cx="104" cy="232" r="22" class="cheek"/>
  <circle cx="296" cy="232" r="22" class="cheek"/>`;
const brows_svg = `
  <path class="ink brow" d="M 112 116 L 164 110"/>
  <path class="ink brow" d="M 236 110 L 288 116"/>`;
const mouth_svg = `<path class="ink mouth" d="${mouth_d}"/>`;

function full_svg(extra_class) {
  return `<svg class="full ${extra_class}" viewBox="0 0 400 400">
    <g id="root">
      ${base_svg}
      <g id="brows">${brows_svg}</g>
      <g id="gaze">
        <ellipse id="eye_l" class="ink" cx="138" cy="168" rx="23" ry="${eye_ry_open}"/>
        <ellipse id="eye_r" class="ink" cx="262" cy="168" rx="23" ry="${eye_ry_open}"/>
      </g>
      ${mouth_svg}
    </g>
  </svg>`;
}

function layer_svg(inner) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 400 400">
    <style>.ink{fill:#7fd6c4;stroke:#7fd6c4}.cheek{fill:#7fd6c4;opacity:.16}
    .brow{fill:none;stroke-width:9;stroke-linecap:round}
    .mouth{stroke-width:10;stroke-linejoin:round;stroke-linecap:round}</style>${inner}</svg>`;
}

// One eye as its own small layer, positioned where the full face puts it.
function eye_box(cx) {
  const w = Math.round(23 * 2 * px + 8);
  const h = Math.round(eye_ry_open * 2 * px + 8);
  return { left: cx * px - w / 2, top: 168 * px - h / 2, w, h };
}

function eye_svg(w, h) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <ellipse cx="${w / 2}" cy="${h / 2}" rx="${23 * px}" ry="${eye_ry_open * px}" fill="#7fd6c4"/></svg>`;
}

async function png_url(svg_text, w, h) {
  const img = new Image();
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg_text);
  await img.decode();
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(img, 0, 0, w, h);
  const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
  return URL.createObjectURL(blob);
}

// --- modes --------------------------------------------------------------------
async function make_layers(as_images, moving) {
  // breath (stepped breathing) > face (CSS sway/breathe, or slow drift) > parts
  stage.innerHTML = `<div id="breath"><div id="face" class="${moving ? "moving" : "drifting"}"></div></div>`;
  const face = document.getElementById("face");

  async function layer(svg_text, w, h, cls) {
    if (as_images) {
      const el = document.createElement("img");
      el.src = await png_url(svg_text, w, h);
      el.width = w; el.height = h;
      el.className = cls;
      await el.decode();
      return el;
    }

    const holder = document.createElement("div");
    holder.className = cls;
    holder.style.width = w + "px"; holder.style.height = h + "px";
    holder.innerHTML = svg_text;
    return holder;
  }

  face.appendChild(await layer(layer_svg(base_svg), 480, 480, "layer"));
  const brows = await layer(layer_svg(brows_svg), 480, 480, "layer saccade");
  face.appendChild(brows);
  face.appendChild(await layer(layer_svg(mouth_svg), 480, 480, "layer"));

  const gaze = document.createElement("div");
  gaze.className = "layer saccade";
  face.appendChild(gaze);

  const eyes = [];

  for (const cx of [138, 262]) {
    const box = eye_box(cx);
    const eye = await layer(eye_svg(box.w, box.h), box.w, box.h, "eye");
    eye.style.left = box.left + "px"; eye.style.top = box.top + "px";
    eye.addEventListener("animationend", () => eye.classList.remove("blinking"));
    gaze.appendChild(eye);
    eyes.push(eye);
  }

  return { face, gaze, brows, eyes };
}

function blink_layers(parts) {
  for (const eye of parts.eyes) eye.classList.add("blinking");
  bench.writes++;
}

function glance_layers(parts) {
  parts.gaze.style.transform = `translate(${(state.tx * px).toFixed(1)}px, ${(state.ty * px).toFixed(1)}px)`;
  parts.brows.style.transform = `translate(${(state.tx * px * 0.4).toFixed(1)}px, ${(state.ty * px * 0.4).toFixed(1)}px)`;
  bench.writes++;
}

async function build_layers(as_images) {
  const parts = await make_layers(as_images, true);

  // JS only flips a class on a blink and sets a target on a glance; the
  // compositor does every in-between frame.
  return (now, delta) => {
    const step = tick_schedule(now, delta);
    if (step.blink_started) blink_layers(parts);
    if (step.glance_started) glance_layers(parts);
  };
}

// --- event-only modes: nothing runs between events, no rAF loop ---------------
//
//   events_img     image layers; blink (CSS keyframes), glance (120 ms
//                  transition), and every 20 s a slow drift of the whole face
//                  (1.6 s transition, a few px and a degree - the burn-in
//                  guard). setTimeout schedules; the page is idle otherwise.
//   events_svg     the same events on the single SVG of today's face: JS
//                  attribute writes in a rAF burst that stops when the event
//                  settles; the drift as a CSS transition on the <svg>.
//   breathe10_img  events_img plus breathing stepped at 10 fps by JS.

function schedule_events(on_blink, on_glance, on_drift) {
  const blink = () => { bench.blinks++; on_blink(); setTimeout(blink, 2200 + rand() * 3600); };
  const glance = () => {
    if (rand() < 0.35) { state.tx = 0; state.ty = 0; }
    else { state.tx = (rand() * 2 - 1) * 11; state.ty = (rand() * 2 - 1) * 6; }
    bench.glances++;
    on_glance();
    setTimeout(glance, 1800 + rand() * 4200);
  };
  const drift = () => {
    on_drift(`translate(${((rand() * 2 - 1) * 8).toFixed(1)}px, ${((rand() * 2 - 1) * 5).toFixed(1)}px) rotate(${((rand() * 2 - 1) * 1.2).toFixed(2)}deg)`);
    bench.writes++;
    setTimeout(drift, 20000);
  };
  setTimeout(blink, 2500);
  setTimeout(glance, 2000);
  setTimeout(drift, 5000);
}

async function build_events_img(breathe) {
  const parts = await make_layers(true, false);
  schedule_events(() => blink_layers(parts), () => glance_layers(parts), (t) => { parts.face.style.transform = t; });

  if (breathe) {
    const breath = document.getElementById("breath");
    setInterval(() => {
      const b = (1 - Math.cos(2 * Math.PI * performance.now() / 4200)) / 2;
      breath.style.transform = `translateY(${(-6 * b).toFixed(1)}px)`;
      bench.frames++;
    }, 100);
  }
}

function build_events_svg() {
  stage.innerHTML = full_svg("drifting");
  const svg = stage.querySelector("svg");
  const gaze = document.getElementById("gaze");
  const brows = document.getElementById("brows");
  const eye_l = document.getElementById("eye_l");
  const eye_r = document.getElementById("eye_r");
  let running = false;
  let last = 0;

  // Runs only until the blink ends and the gaze has settled, then stops.
  const burst = (now) => {
    const delta = Math.min((now - last) / 1000, 0.05);
    last = now;
    bench.frames++;
    const step = tick_schedule(now, delta);
    const ry = (eye_ry_closed + (eye_ry_open - eye_ry_closed) * step.open).toFixed(1);
    eye_l.setAttribute("ry", ry); eye_r.setAttribute("ry", ry);
    gaze.setAttribute("transform", `translate(${state.gx.toFixed(1)} ${state.gy.toFixed(1)})`);
    brows.setAttribute("transform", `translate(${(state.gx * 0.4).toFixed(1)} ${(state.gy * 0.4).toFixed(1)})`);
    bench.writes++;
    const settled = state.blink_start < 0 && Math.abs(state.gx - state.tx) < 0.05 && Math.abs(state.gy - state.ty) < 0.05;

    if (settled) { running = false; return; }
    requestAnimationFrame(burst);
  };
  const kick = () => {
    if (running) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(burst);
  };

  // The shared schedule's own timers are not used here: the event timers
  // below decide when, tick_schedule only shapes the blink inside a burst.
  state.next_blink = Infinity;
  state.next_glance = Infinity;
  schedule_events(
    () => { state.blink_start = performance.now(); kick(); },
    () => kick(),
    (t) => { svg.style.transform = t; },
  );
}

function build_svg(attr_everything) {
  stage.innerHTML = full_svg(attr_everything ? "" : "moving");
  const root = document.getElementById("root");
  const gaze = document.getElementById("gaze");
  const brows = document.getElementById("brows");
  const eye_l = document.getElementById("eye_l");
  const eye_r = document.getElementById("eye_r");
  let last_ry = "", last_gaze = "", last_root = "";

  return (now, delta) => {
    const step = tick_schedule(now, delta);
    const ry = (eye_ry_closed + (eye_ry_open - eye_ry_closed) * step.open).toFixed(1);

    if (ry !== last_ry) {
      eye_l.setAttribute("ry", ry); eye_r.setAttribute("ry", ry);
      last_ry = ry; bench.writes++;
    }

    const g = `translate(${state.gx.toFixed(1)} ${state.gy.toFixed(1)})`;

    if (g !== last_gaze) {
      gaze.setAttribute("transform", g);
      brows.setAttribute("transform", `translate(${(state.gx * 0.4).toFixed(1)} ${(state.gy * 0.4).toFixed(1)})`);
      last_gaze = g; bench.writes++;
    }

    if (attr_everything) {
      const p = body_pose(now);
      const r = `translate(${p.dx.toFixed(2)} ${p.dy.toFixed(2)}) rotate(${p.rot.toFixed(2)} 200 288) scale(${p.scale.toFixed(4)})`;

      if (r !== last_root) {
        root.setAttribute("transform", r);
        last_root = r; bench.writes++;
      }
    }
  };
}

function build_canvas() {
  stage.innerHTML = `<canvas id="c" width="480" height="480"></canvas>`;
  const ctx = document.getElementById("c").getContext("2d");
  const mouth = new Path2D(mouth_d);

  return (now, delta) => {
    const step = tick_schedule(now, delta);
    const p = body_pose(now);
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, 480, 480);
    ctx.setTransform(px, 0, 0, px, 0, 0);
    ctx.translate(200 + p.dx, 288 + p.dy);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.scale(p.scale, p.scale);
    ctx.translate(-200, -288);
    ctx.fillStyle = "rgba(127,214,196,0.16)";
    for (const cx of [104, 296]) { ctx.beginPath(); ctx.arc(cx, 232, 22, 0, 2 * Math.PI); ctx.fill(); }
    ctx.strokeStyle = "#7fd6c4"; ctx.fillStyle = "#7fd6c4"; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(112 + state.gx * 0.4, 116 + state.gy * 0.4); ctx.lineTo(164 + state.gx * 0.4, 110 + state.gy * 0.4);
    ctx.moveTo(236 + state.gx * 0.4, 110 + state.gy * 0.4); ctx.lineTo(288 + state.gx * 0.4, 116 + state.gy * 0.4);
    ctx.stroke();
    const ry = eye_ry_closed + (eye_ry_open - eye_ry_closed) * step.open;
    for (const cx of [138, 262]) { ctx.beginPath(); ctx.ellipse(cx + state.gx, 168 + state.gy, 23, ry, 0, 0, 2 * Math.PI); ctx.fill(); }
    ctx.lineWidth = 10; ctx.fill(mouth); ctx.stroke(mouth);
    bench.writes++;
  };
}

async function main() {
  if (mode.startsWith("events") || mode.startsWith("breathe")) {
    if (mode === "events_img") await build_events_img(false);
    else if (mode === "breathe10_img") await build_events_img(true);
    else if (mode === "events_svg") build_events_svg();
    else throw new Error(`unknown mode ${mode}`);

    document.title = `face bench: ${mode}`;
    return;
  }

  if (mode === "static") stage.innerHTML = full_svg("");

  const update =
    mode === "static" ? (now, delta) => { tick_schedule(now, delta); } :
    mode === "svg_attr" ? build_svg(true) :
    mode === "svg_hybrid" ? build_svg(false) :
    mode === "layers_css" ? await build_layers(false) :
    mode === "layers_img" ? await build_layers(true) :
    mode === "canvas" ? build_canvas() :
    null;

  if (update === null) throw new Error(`unknown mode ${mode}`);

  document.title = `face bench: ${mode}`;
  let last = performance.now();

  const step = (now) => {
    requestAnimationFrame(step);
    bench.raf++;

    if (now - last < frame_ms) return;

    const delta = Math.min((now - last) / 1000, 0.05);
    last = now;
    bench.frames++;
    update(now, delta);
  };

  requestAnimationFrame(step);
}

main();
</script>
</body>
</html>
