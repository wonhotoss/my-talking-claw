[project]
name = "my-talking-claw-face-sheet"
version = "0.1.0"
description = "Printable drawing sheets for the face parts, and the photo extractor that turns a drawn sheet into transparent part images."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0.0",
    "opencv-python>=4.10.0",
    "pymupdf>=1.24.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
