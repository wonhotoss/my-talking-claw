[project]
name = "my-talking-claw-agent-gateway"
version = "0.1.0"
description = "Stand-in agent gateway implementing the nullclaw webhook contract, backed by headless Claude Code."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
